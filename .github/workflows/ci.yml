name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: seeder assert (enumeration + budget)
        run: node seed/seeder.mjs --quiet
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: license assert (permissive-only production graph)
        run: npm run license-assert
