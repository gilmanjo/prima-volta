<header class="page"><h1>F6 · Arpeggios</h1>
<p>Spec: <code>../F6-arpeggios.md</code> · Full tier ladder T1–T6 plus the teach state and results. Graded reps always show a blank keyboard — path dots appear only on an item's first encounter.</p></header>

<div class="grouphead">teach state <small>first encounter only, ungraded</small></div>
<div class="row">
<figure class="wide">
  <div class="phoneL">
    <div class="statusrow">ARPEGGIOS · new<span class="chip">Teach</span><span class="devchip"><i></i>FP-30X · USB</span></div>
    <div class="landmain">
      <div class="prompt"><div class="big">G major</div><div class="sub">Arpeggio · 2 octaves · RH · up-down</div></div>
      <div class="rightcol">
        <div class="feedback info">Ungraded — take your time</div>
      </div>
    </div>
    <div class="kbdcard"><svg id="teach"></svg></div>
    <div class="footerbar"><div class="btn primary">Play it once</div></div>
  </div>
  <figcaption><b>Teach state.</b> Brass dots preview the traversal on the very first encounter only (teach-first, grade-later), carrying the sourced fingering — 1-2-3 crossings, 5 on top, never invented. Up-down turns on the top note once; every graded rep afterwards is from memory.</figcaption>
</figure>
</div>

<figure class="wide">
  <div class="phoneL">

  </div>

<figure class="wide">

</figure>

<figure class="wide">
  <div class="phoneL">

  </div>
  <figcaption><b>T4 — dominant and diminished 7ths</b> (the RCM arpeggio set). Four chord tones per octave change the fingering geometry entirely; teach state re-runs once for the new basis.</figcaption>
</figure>

<figure class="wide">
  <div class="phoneL">
    <div class="statusrow">ARPEGGIOS · 5/5<span class="chip mode">Rehearsal</span><span class="devchip"><i></i>FP-30X · USB</span></div>

  </div>
  <figcaption><b>T5 — three to four octaves at the speed gate</b> (RCM anchor ♪=80, shown on the metronome). The viewport is beat-indexed to the expected path — leading the hand, never chasing played keys; grading is unchanged.</figcaption>
</figure>

<figure class="wide">
  <div class="phoneL">
    <div class="statusrow">ARPEGGIOS · 6/6<span class="chip mode">Rehearsal</span><span class="devchip"><i></i>FP-30X · USB</span></div>
    <div class="landmain">
      <div class="prompt"><div class="big">E♭ major</div><div class="sub">4 octaves · alternating hands · up-down</div></div>
      <div class="rightcol">
        <div class="metro"><i></i><i></i><i class="on"></i><i></i><span>♪ = 76 · oct 2 of 4</span></div>
      </div>
    </div>
    <div class="kbdcard"><svg id="t6"></svg></div>
    <div class="hintline">LH takes an octave, RH the next</div>
  </div>
  <figcaption><b>T6 — alternating hands, the capstone.</b> Hands leapfrog octave by octave up the keyboard (the romantic-repertoire flourish). The graded quantity is the <b>handoff seam</b>: the inter-onset gap across each hand exchange, tagged <code>handoff</code> — evenness must survive the exchange. Admits after the T5 gates.</figcaption>
</figure>

</div>
